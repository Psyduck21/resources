<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            color: #e6edf3;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle at top right, #1f6feb 0%, transparent 40%),
                              radial-gradient(circle at bottom left, #238636 0%, transparent 40%);
            background-size: cover;
            background-attachment: fixed;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 32px rgba(88, 166, 255, 0.15);
            border-color: #58a6ff;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 12px;
            color: #e6edf3;
            letter-spacing: -0.5px;
        }
        p {
            color: #8b949e;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 15px;
        }
        .btn {
            display: inline-block;
            background-color: #238636;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(240, 246, 252, 0.1);
        }
        .btn:hover {
            background-color: #2ea043;
            box-shadow: 0 0 15px rgba(46, 160, 67, 0.4);
        }
        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📚</div>
        <h1>Learning Hub</h1>
        <p>Your technical resources are attached here. Access your comprehensive guide below to enhance your coding skills.</p>
        <a href="index.html" class="btn">Launch Java Data Structure Resource</a>
    </div>
</body>
</html>
