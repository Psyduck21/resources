<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Main Page Layout & Minimal Background */
body {
    background-color: #0d1117;
    color: #e6edf3;
    font-family: 'Inter', sans-serif;
    margin: 0;
    padding: 60px 20px;
    min-height: 100vh;
}

/* Page Header */
.header {
    text-align: center;
    max-width: 800px;
    margin: 0 auto 50px auto;
}

h1 {
    font-size: 32px;
    margin-bottom: 12px;
    color: #e6edf3;
    letter-spacing: -0.5px;
}

/* Grid Container for Study Resources */
.directory-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
}

/* Study Resource Card */
.card {
    background-color: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    display: flex;
    flex-direction: column;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 32px rgba(88, 166, 255, 0.15);
    border-color: #58a6ff;
}

/* Card Typography */
.card h2 {
    font-size: 20px;
    margin: 0 0 12px 0;
    color: #ffffff;
}

p {
    color: #8b949e;
    line-height: 1.6;
    margin-bottom: 24px;
    font-size: 14px;
    flex-grow: 1; /* Keeps buttons aligned at the bottom if description lengths vary */
}

/* Subject/Format Category Tag (e.g., "Physics", "PDF") */
.tag {
    display: inline-block;
    background-color: rgba(88, 166, 255, 0.1);
    color: #58a6ff;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 16px;
    align-self: center;
}

/* Action Buttons */
.btn {
    display: inline-block;
    background-color: #238636;
    color: #ffffff;
    text-decoration: none;
    padding: 12px 20px;
    border-radius: 6px;
    font-weight: 600;
    transition: background-color 0.2s, box-shadow 0.2s;
    border: 1px solid rgba(240, 246, 252, 0.1);
    width: 100%; /* Full width for easier clicking on mobile/desktop */
    box-sizing: border-box;
}

.btn:hover {
    background-color: #2ea043;
    box-shadow: 0 0 15px rgba(46, 160, 67, 0.4);
}

/* Resource Icons */
.icon {
    font-size: 42px;
    margin-bottom: 16px;
}
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📚</div>
        <h1>Learning Hub</h1>
        <p>Your technical resources are attached here. Access your comprehensive guide below to enhance your coding skills.</p>
        <a href="Java_Data_Structure_Resource.html" class="btn">Launch Java Data Structure Resource</a>
    </div>
</body>
</html>
